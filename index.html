/* Layout: une colonne type téléphone ; accueil = tableau noir + onglets de niveau + liste des leçons ; quiz = énoncé au tableau, réponses A–D empilées */
:root{

  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:16px;padding-block:16px 32px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit}
.board{background:var(--board);color:var(--boardink);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.board h1{font-size:2rem;color:var(--chalk)}

.stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.13);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tabs:has(> .tab:only-child){display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.25rem;line-height:1.1}

.tab[aria-selected="true"] small{color:var(--dark)}

.lessons{display:flex;flex-direction:column;gap:10px}
.lesson{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;transition:border-color .15s,transform .15s}
.lesson:hover{border-color:var(--lc);transform:translateX(2px)}
.lesson .num{width:40px;height:40px;border-radius:12px;background:var(--lc);color:var(--dark);display:grid;place-items:center;font-family:var(--display);font-size:1.15rem}
.lesson .txt{min-width:0}
.lesson h3{font-size:1.08rem}
.lesson small{color:var(--muted);font-size:.85rem}
.lesson.mix{background:var(--dark);border-color:var(--dark);color:#fff}
.lesson.mix small{color:var(--boardink);opacity:.8}
.lesson.mix .num{background:var(--chalk)}
.stars{color:var(--c1);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.lesson.mix .stars .off{color:rgba(255,255,255,.25)}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.back{all:unset;cursor:pointer;font-weight:800;color:var(--muted);padding:6px 2px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc);transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.question{background:var(--board);color:var(--boardink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.question .tag{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:800}
.question .q{font-family:var(--display);font-size:clamp(1.25rem,5.2vw,1.6rem);color:var(--chalk);line-height:1.25;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt .letter{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-family:var(--display);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--lc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.ok .letter{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.ko .letter{background:var(--bad);color:#fff}
.explain{border-radius:14px;padding:12px 14px;border:2px solid;font-size:.95rem}
.explain.ok{border-color:var(--good)} .explain.ko{border-color:var(--bad)}
.explain b{display:block;font-family:var(--display);font-size:1.1rem}
.explain.ok b{color:var(--good)} .explain.ko b{color:var(--bad)}
.btn{all:unset;cursor:pointer;text-align:center;background:var(--board);color:#fff;padding:14px;border-radius:14px;font-family:var(--display);font-size:1.15rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .big{font-family:var(--display);font-size:4rem;line-height:1;color:var(--chalk);font-variant-numeric:tabular-nums}
.result .stars{font-size:2rem}
.actions{display:grid;gap:10px}
.review{display:flex;flex-direction:column;gap:8px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 12px;font-size:.92rem}
.miss .good{color:var(--good);font-weight:800}
.tip{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
.pop{animation:pop .2s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.3rem}
.form label{font-weight:800;font-size:.9rem;margin-bottom:-6px}
.form input,textarea{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.form input:focus,textarea:focus{outline:none;border-color:var(--c2)}
.err{color:var(--bad);font-weight:700;margin:0}
.ok-text{color:var(--good);font-weight:700;margin:0}
.muted{color:var(--muted);font-size:.9rem;margin:0}
.link{all:unset;cursor:pointer;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-align:center;padding:6px}
.link:focus-visible{outline:3px solid var(--c2)}
.opt.sel{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 18%,var(--surface))}

.btn:disabled{opacity:.45;cursor:default}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;cursor:pointer}

.check input{width:20px;height:20px;accent-color:var(--board)}
.check small{color:var(--muted);white-space:nowrap}
.cntbox{display:flex;align-items:center;gap:6px}
.cntbox input{width:64px;font:inherit;font-weight:800;text-align:center;color:var(--ink);background:var(--soft);border:2px solid var(--lc);border-radius:10px;padding:6px 4px;min-height:38px;line-height:1.2}
.cntbox input:focus{outline:3px solid var(--c2);outline-offset:1px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--board);color:var(--boardink);border-radius:14px;padding:14px 16px}

.small-btn{all:unset;cursor:pointer;font-weight:800;font-size:.9rem;padding:8px 14px;border-radius:10px;background:var(--board);color:#fff;text-align:center}
.codebox .small-btn{background:var(--chalk);color:var(--dark)}
.small-btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.small-btn.danger{background:var(--bad);color:#fff}
.small-btn:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px;overflow-wrap:anywhere;user-select:all}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--soft)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.ko{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.summary span{font-size:.75rem;color:var(--muted);font-weight:700}
.corr{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:10px 12px;font-size:.92rem}
.corr.wrong{border-left-color:var(--bad)}
.corr .you{color:var(--bad);font-weight:800}
.corr .good{color:var(--good);font-weight:800}
a.btn{text-decoration:none}
.addr{font-weight:800;overflow-wrap:anywhere;user-select:all}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input{flex:1 1 200px}
.form select{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.form select:focus{outline:none;border-color:var(--c2)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.settings .field{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .settings label{margin:0}
.timer{align-self:center;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;padding:4px 16px;border-radius:99px;background:var(--surface);border:2px solid var(--line)}
.ctx p{margin:0;font-size:.95rem;line-height:1.5}
.ctx .label{color:var(--lc)}
.pwcell{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.12em}
.timer.low{border-color:var(--bad);color:var(--bad)}
.qimg{margin:0;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.qimg img{max-width:100%;max-height:230px;object-fit:contain;cursor:zoom-in;display:block;margin:0 auto}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;z-index:50;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}

function copyText(text,btn){
  const done=()=>{const t=btn.textContent;btn.textContent="Copié ✓";setTimeout(()=>btn.textContent=t,1600)};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done()}catch(e){btn.textContent="Sélectionnez le texte pour le copier"}ta.remove()};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}
const isVF=o=>o.length===2&&o.includes("Vrai")&&o.includes("Faux");
function toQuestions(pool,n){
  /* plusieurs tirages : on garde celui qui remplit les n questions sans couper d'exercice */
  const fill=()=>{const units=shuffle(pool),out=[];
    for(const u of units){if(out.length>=n)break;if(u.length<=n-out.length)out.push(...u)}
    let cut=0;if(out.length<n){const ex=units.find(u=>u.length>n-out.length&&!out.includes(u[0]));if(ex){cut=n-out.length;out.push(...ex.slice(0,cut))}}
    return{out,cut}};
  let best=fill();for(let t=0;t<40&&best.cut;t++){const r=fill();if(r.cut<best.cut||(r.cut===best.cut&&r.out.length>best.out.length))best=r}
  const out=best.out;
  return out.map(({q,ch,ctx,cimg,ttl,k,kn})=>({text:q[0],answer:q[1][0],opts:isVF(q[1])?["Vrai","Faux"]:shuffle(q[1]),exp:q[2],img:q[3]||cimg||"",ch,ctx,ttl,k,kn}))}

function zoomImg(src){const d=document.createElement("div");d.className="zoom";d.innerHTML=`<img src="${esc(src)}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d)}

function findStudent(name,classes){const k=nkey(name);if(!k)return null;for(const c of classes){const n=CLASSES[c].find(x=>nkey(x)===k);if(n)return{name:n,cls:c}}return null}

/* ---------- Codes de quiz : 12 caractères (ex. 4K7Q-M2PD-R4X9A) qui contiennent
   les leçons, les classes, la durée, la date et la plage horaire, avec une clé de contrôle
   (un code modifié à la main est refusé). ---------- */
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const NB_LES=0, NB_LES2=17;
const DAY0=Date.UTC(2026,8,1);
const p2=n=>String(n).padStart(2,"0");
const hm=m=>p2(Math.floor(m/60))+":"+p2(m%60);
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?+m[1]*60+ +m[2]:NaN};
const dayOf=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-DAY0)/864e5):NaN};
const isoOf=t=>{const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const localAt=(day,min)=>{const d=new Date(DAY0+day*864e5);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),0,min).getTime()};
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const dayLabel=day=>{const d=new Date(localAt(day,0));return JOURS[d.getDay()]+" "+p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()};
const chk=v=>parseInt(hash("exo3ac|"+v.toString()),36)%32;
const MASK=0x5B2F8E3D71C4A69n&((1n<<60n)-1n);
const MASK2=((0x5B2F8E3D71C4A695n<<1n)|1n)&((1n<<65n)-1n);
const fmtCode=s=>s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8);
const fmtX=t=>t?"-"+t.match(/.{1,4}/g).join("-"):"";
const chk2=(s,w)=>parseInt(hash("exo3ac-n|"+s+"|"+w.toString()),36)%32;
/* Les codes de 12 caractères restent valides ; un quiz qui contient une leçon n° 20 ou plus a un code de 13 caractères */
function makeQuiz(o){
  let v=0n;const put=(x,b)=>{v=(v<<BigInt(b))|BigInt(x)};
  const big=o.idx.some(i=>i>=NB_LES),nl=big?NB_LES2:NB_LES,len=big?13:12;
  put(o.cnt?1:0,1);put(Math.max(1,Math.min(8,o.tries||1))-1,3);
  put(o.idx.reduce((m,i)=>m|(1<<i),0),nl);
  put(o.cls.reduce((m,c)=>m|(1<<CLS.indexOf(c)),0),5);
  put(o.dur,7);put(o.day,9);put(o.start/5,9);put(o.end/5,9);
  v=((v<<5n)|BigInt(chk(v)))^(big?MASK2:MASK);
  let s="";for(let i=0;i<len;i++){s=B32[Number(v&31n)]+s;v>>=5n}
  let t="";
  if(o.cnt){const ids=[...o.idx].sort((a,b)=>a-b);let w=0n,nb=5;for(const i of ids){w=(w<<6n)|BigInt(o.cnt[i]);nb+=6}
    w=(w<<5n)|BigInt(chk2(s,w));for(let k=0;k<Math.ceil(nb/5);k++){t=B32[Number(w&31n)]+t;w>>=5n}}
  return fmtCode(s)+fmtX(t);
}
function parseCode(c){
  let s=String(c||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1").replace(/U/g,"V");
  let sx="";if(s.length>13){sx=s.slice(13);s=s.slice(0,13)}
  if(s.length!==12&&s.length!==13)return null;
  const big=s.length===13,nl=big?NB_LES2:NB_LES;
  let v=0n;for(const ch of s){const k=B32.indexOf(ch);if(k<0)return null;v=(v<<5n)|BigInt(k)}
  v^=big?MASK2:MASK;const ck=Number(v&31n);v>>=5n;if(chk(v)!==ck)return null;
  const get=b=>{const x=Number(v&((1n<<BigInt(b))-1n));v>>=BigInt(b);return x};
  const end=get(9)*5,start=get(9)*5,day=get(9),dur=get(7),cm=get(5),lm=get(nl),tries=get(3)+1,per=get(1);
  const L=BANK["3AC"];
  const idx=[];for(let i=0;i<nl;i++)if(lm&(1<<i))idx.push(i);
  const cls=CLS.filter((_,i)=>cm&(1<<i));
  if(!idx.length||idx.some(i=>i>=L.chapters.length)||!cls.length||dur<1||end<=start)return null;
  const n=idx.reduce((t,i)=>t+nQ(L.chapters[i]),0);
  if(!!per!==!!sx)return null;
  let cnt=null;
  if(sx){const k=idx.length;if(sx.length!==Math.ceil((6*k+5)/5))return null;
    let w=0n;for(const ch of sx){const d=B32.indexOf(ch);if(d<0)return null;w=(w<<5n)|BigInt(d)}
    const ck2=Number(w&31n);w>>=5n;if(chk2(s,w)!==ck2)return null;
    cnt={};for(let j=k-1;j>=0;j--){cnt[idx[j]]=Number(w&63n);w>>=6n}
    if(w!==0n||idx.some(i=>!(cnt[i]>=1&&cnt[i]<=nQ(L.chapters[i]))))return null}
  const nq=cnt?idx.reduce((t,i)=>t+cnt[i],0):Math.min(QN,n);
  return{level:"3AC",idx,cls,dur,day,start,end,n,cnt,nq,tries,code:fmtCode(s)+fmtX(sx),open:localAt(day,start),close:localAt(day,end)};
}
/* ---------- Comptes élèves : mot de passe personnel généré à partir du nom et de la classe ---------- */
const PW_SECRET="QCM3AC-DE65FB0721CDD9DF";
const PWA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function pwOf(cls,name){let h=2166136261>>>0,out="";const s=PW_SECRET+"|"+cls+"|"+nkey(name);
  for(let r=0;r<6;r++){for(const ch of s+"#"+r){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}out+=PWA[h%PWA.length]}
  return out}
const normPw=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const quizInfo=q=>`${dayLabel(q.day)}, de ${hm(q.start)} à ${hm(q.end)} · ${q.nq} questions · ${q.tries} essai${q.tries>1?"s":""} par élève · durée ${q.dur} min · ${q.cls.join(", ")}`;
/* ---------- Signature des résultats (empêche de modifier la note dans le message) ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}
  let h2=h;for(const ch of s+SALT){h2^=ch.codePointAt(0);h2=Math.imul(h2,2654435761)>>>0}
  return(h.toString(36)+h2.toString(36)).toUpperCase().slice(-6)}
const sign=r=>hash([SALT,norm(r.name),norm(r.cls),r.quiz,r.score,r.total,r.date].join("|"));
const message=r=>`LaboQCM | Nom: ${r.name} | Classe: ${r.cls} | Quiz: ${r.quiz} | Note: ${r.score}/${r.total} | Date: ${r.date} | Code: ${r.sig}`;
function parseMessage(line){
  if(!/LaboQCM/i.test(line))return null;
  const g=k=>{const m=line.match(new RegExp("\\b"+k+":\\s*([^|]*)"));return m?m[1].trim():""};
  const note=g("Note").match(/(\d+)\s*\/\s*(\d+)/);if(!g("Nom")||!note)return null;
  const r={name:g("Nom"),cls:g("Classe"),quiz:g("Quiz"),score:+note[1],total:+note[2],date:g("Date"),sig:g("Code").toUpperCase()};
  r.valid=sign(r)===r.sig;return r;
}
/* ---------- E-mail du professeur : enregistré par le professeur, transmis aux élèves dans le lien du quiz ("2AC-ADF~xxxx") ---------- */
const MAIL_RE=/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']{2,}$/;
const validMail=m=>typeof m==="string"&&m.length<=80&&MAIL_RE.test(m);
function encMail(m){try{return btoa(unescape(encodeURIComponent(m))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(e){return""}}
function decMail(t){try{t=String(t||"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const m=decodeURIComponent(escape(atob(t))).trim().toLowerCase();return validMail(m)?m:""}catch(e){return""}}

}

  return"mailto:"+e(mail).replace(/%40/g,"@")+"?subject="+e(`LaboQCM - ${r.name} - ${r.cls} - Quiz ${r.quiz}`)+"&body="+e(msg);
}
/* ---------- Envoi automatique de la note vers la feuille Google Sheets du professeur (application web Apps Script) ---------- */
const SHEET_URL="https://script.google.com/macros/s/AKfycbz0qpNtFGsfGFpCA9rghXdgdyRiz817QWsddPGymDDSMvafukXE0zjKMXUgi7jrGfu3/exec";
const canSend=()=>!!SHEET_URL&&!FRAMED;
/* Un envoi. Google répond parfois par une page d'erreur alors que la note est bien enregistrée :
   on renvoie alors la même note, le script la reconnaît (pas de doublon) et confirme. */
async function postGrade(r){
  const res=await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({name:r.name,cls:r.cls,quiz:r.quiz,score:r.score,total:r.total,date:r.date,sig:r.sig})});
  const t=await res.text();try{return JSON.parse(t)}catch(e){return null}
}
async function sendGrade(done){
  if(done.sent)return true;
  for(let k=0;k<4;k++){
    if(k)await new Promise(ok=>setTimeout(ok,k*1500));
    let j=null;try{j=await postGrade(done.rec)}catch(e){}
    if(j&&j.ok){done.sent=true;LS.set(doneKey(done.rec.quiz,done.k||1),done);return true}
    if(j&&j.error){const e=new Error(String(j.error));e.server=true;throw e}
  }
  throw new Error("envoi impossible");
}
/* Au démarrage : renvoyer les notes qui n'ont pas pu partir (élève hors connexion à la fin du quiz) */
function retryPending(){
  if(!canSend())return;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf("ex3-done-")===0){const d=LS.get(k,null);if(d&&d.rec&&d.auto&&!d.sent)sendGrade(d).catch(()=>{})}}}catch(e){}
}

    const now=Date.now();
    if(now<q.open)return fail(`Le quiz n'a pas encore commencé. Il ouvre le ${dayLabel(q.day)} à ${hm(q.start)}.`);
    if(now>=q.close)return fail(`Le quiz est fermé depuis le ${dayLabel(q.day)} à ${hm(q.end)}.`);
    if(canSend()){
      const btn=byId("f").querySelector("button[type=submit]");btn.disabled=true;err.hidden=true;
      const st=document.createElement("p");st.className="muted";st.textContent="Vérification de tes essais…";btn.after(st);
      let j=null;try{const r=await fetch(SHEET_URL+"?cle="+encodeURIComponent(LS.get("ex3-skey","CSH2027")||"CSH2027"));j=JSON.parse(await r.text())}catch(x){}
      st.remove();btn.disabled=false;
      if(!j)return fail("Impossible de vérifier tes essais : connecte-toi à Internet, puis réessaie.");
      if(j.ok&&Array.isArray(j.notes)){const sent=j.notes.filter(x=>String(x.quiz||"").replace(/[^0-9A-Z]/gi,"").toUpperCase()===q.code.replace(/-/g,"")&&nkey(x.name)===nkey(stu.name)).length;
        if(sent>used){used=sent;LS.set(tk,used)}}
      if(used>=q.tries)return noMore();
    }
    used++;LS.set(tk,used);
    run={k:used,tries:q.tries,name:stu.name,cls:stu.cls,quiz:q.code,level:"3AC",qs:q.cnt?shuffle(q.idx.flatMap(i=>toQuestions(poolOf("3AC",[i]),q.cnt[i]))):toQuestions(poolOf("3AC",q.idx),QN),i:0,picks:[],start:now,deadline:Math.min(now+q.dur*60000,q.close)};
    LS.set("ex3-run",run);
    examAsk(run);
  };
}

function examAsk(run){
  stopTick();
  if(run.deadline&&Date.now()>=run.deadline)return finishRun(run,true);
  const q=run.qs[run.i],n=run.qs.length;setColor(run.level);let pick=null;
  $app.innerHTML=`
  <div class="top"><span class="count">${esc(run.name)}</span><div class="bar"><i style="width:${run.i/n*100}%"></i></div><span class="count">${run.i+1}/${n}</span></div>
  ${run.deadline?`<div class="timer" id="tmr" role="timer" aria-live="off"></div>`:""}
  ${ctxHTML(q)}${imgHTML(q)}<section class="question pop"><span class="tag">${esc(run.cls)} · ${esc(q.ch)}</span><div class="q">${esc(q.text)}</div></section>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <button class="btn" id="next" disabled>${run.i+1<n?"Valider et continuer":"Valider et terminer"}</button>
  <p class="muted" style="text-align:center">Choisis une réponse. Tu ne pourras pas revenir en arrière.${run.deadline?" Quand le temps est fini, le quiz est envoyé automatiquement.":""}</p>`;
  const btns=[...$app.querySelectorAll(".opt")],next=byId("next");
  if(run.deadline){
    const tmr=byId("tmr");
    const upd=()=>{
      const left=run.deadline-Date.now();
      if(left<=0){stopTick();return finishRun(run,true)}
      const s=Math.ceil(left/1000);
      tmr.textContent=`Temps restant ${Math.floor(s/60)}:${p2(s%60)}`;
      tmr.classList.toggle("low",s<=60);
    };
    upd();tick=setInterval(upd,1000);
  }
  btns.forEach(b=>b.onclick=()=>{pick=+b.dataset.k;btns.forEach(x=>x.classList.toggle("sel",x===b));next.disabled=false});
  next.onclick=()=>{
    if(pick==null)return;
    run.picks[run.i]=q.opts[pick];run.i++;LS.set("ex3-run",run);
    if(run.i<n)return examAsk(run);
    finishRun(run,false);
  };
}

/* Comptes professeurs : chaque prof crée son compte avec le code d'établissement.
   Les comptes sont enregistrés sur l'appareil (empreinte SHA-256 salée, jamais le mot de passe). */
const INVITE_HASH="bfc6fc7c67723e8dac6e5031bad3b1b8b1fe2476753e8efdbb5cecc25aacf7a1";
let profUser=null,fails=0,lockUntil=0,authMode=null;
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const accounts=()=>LS.get("ex3-accounts",{});
const tokenOf=u=>(accounts()[u]||{}).hash;
const gradesKey=()=>"ex3-grades-"+profUser;
(function restore(){

function openSession(u,h,keep){

}

    <label class="row" style="margin:0;font-weight:600" for="keep"><input type="checkbox" id="keep" style="width:18px;height:18px"> Rester connecté sur cet appareil</label>

    const keep=document.getElementById("keep").checked;
    if(Date.now()<lockUntil)return fail(`Trop d'essais. Réessayez dans ${Math.ceil((lockUntil-Date.now())/1000)} secondes.`);
    try{
      if(isNew){
        if(!/^[a-z0-9._-]{3,30}$/.test(u))return fail("Identifiant : au moins 3 caractères (lettres, chiffres, point, tiret), sans espace.");
        if(accounts()[u])return fail("Cet identifiant existe déjà sur cet appareil. Choisissez-en un autre.");
        if(pw.length<6)return fail("Le mot de passe doit avoir au moins 6 caractères.");
        if(pw!==document.getElementById("pw2").value)return fail("Les deux mots de passe ne sont pas identiques.");
        const inv=document.getElementById("inv").value.replace(/\s+/g,"").toUpperCase();
        if(await sha256("laboqcm-invite|"+inv)!==INVITE_HASH){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}return fail("Code d'établissement incorrect. Demandez-le au responsable.")}
        const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
        const h=await sha256("laboqcm|"+u+"|"+salt+"|"+pw);
        const all=accounts();
        if(!Object.keys(all).length){const old=LS.get("ex3-grades",null);if(old)LS.set("ex3-grades-"+u,old)} /* reprise des notes de l'ancien compte par défaut */

        authMode="in";return openSession(u,h,keep);

      const a=accounts()[u];if(a){const x=await sha256("laboqcm|"+u+"|"+a.salt+"|"+pw);if(x===a.hash)h=x}
      if(h)return openSession(u,h,keep);
    }catch(x){return fail("La connexion a échoué sur ce navigateur. Essayez avec Chrome.")}
    fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}
    fail("Identifiant ou mot de passe incorrect.");document.getElementById("pw").value="";
  };
}

function quizDefaults(){

/* Lignes collées par le professeur : messages « LaboQCM » ou lignes copiées depuis la feuille Google */
function parseRow(line){
  const m=parseMessage(line);if(m)return m;
  const cells=line.split(/\t|;|\s\|\s/).map(s=>s.trim()).filter(Boolean);
  if(cells.length<3)return null;
  let stu=null,quiz="",score=null,total=10,date="";
  for(const c of cells){
    if(!stu){const f=findStudent(c,CLS);if(f){stu=f;continue}}
    if(!quiz){const q=parseCode(c);if(q){quiz=q.code;continue}}
    const fr=c.match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/);if(fr&&score==null){score=+fr[1];total=+fr[2];continue}
    if(/^\d{1,2}$/.test(c)){if(score==null)score=+c;else total=+c;continue}
    if(!date&&/\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}/.test(c))date=c;
  }
  if(!stu||!quiz||score==null||!total||score>total)return null;
  return{name:stu.name,cls:stu.cls,quiz,score,total,date,sig:"",valid:true,src:"feuille"};
}

/* ---------- PDF des comptes élèves (jsPDF chargé à la demande) ---------- */
function loadJsPDF(){return window.jspdf?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="jspdf.umd.min.js";s.onload=ok;s.onerror=()=>ko(new Error("jsPDF"));document.head.appendChild(s)})}
/* Noms en arabe : jsPDF ne sait pas écrire l'arabe, on dessine le nom dans une image (le navigateur relie les lettres) */
function nameTxt(doc,t,x,y,pt,bold){
  if(/^[\x00-\x7F]*$/.test(t)){doc.text(t,x,y);return}
  const k=6,fpx=pt*k,c=document.createElement("canvas"),g=c.getContext("2d"),font=(bold?"bold ":"")+fpx+"px Arial, Tahoma, sans-serif";
  g.font=font;const w=Math.ceil(g.measureText(t).width)+8,h=Math.ceil(fpx*1.5);c.width=w;c.height=h;
  g.font=font;g.fillStyle="#0f1b2d";g.direction="rtl";g.textAlign="right";g.textBaseline="alphabetic";g.fillText(t,w-4,Math.round(fpx*1.12));
  const mm=.3528/k;doc.addImage(c.toDataURL("image/png"),"PNG",x,y-fpx*1.12*mm,w*mm,h*mm);
}
function buildAccountsPdf(classes,prof,dateStr){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=15,green=[11,79,214],chalk=[255,212,0];
  let first=true;
  const header=(title,sub)=>{if(!first)doc.addPage();first=false;
    doc.setFillColor(...green);doc.rect(0,0,W,24,"F");
    doc.setTextColor(...chalk);doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text(title,M,11);
    doc.setTextColor(242,246,243);doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(sub,M,18);
    doc.setTextColor(15,27,45)};
  classes.forEach(c=>{
    const list=CLASSES[c];
    header("Exercice PC 3AC - Comptes des élèves - "+c,`Physique-chimie · ${list.length} élèves · généré le ${dateStr}${prof?" · professeur : "+prof:""}`);
    let y=34;doc.setFontSize(9.5);doc.setTextColor(74,90,112);
    doc.text("Pour passer un quiz : code du quiz, classe, nom et prénom, puis le mot de passe ci-dessous.",M,y-3);
    const cols=[[M,12,"N°"],[M+12,118,"Nom et prénom"],[M+130,50,"Mot de passe"]];const rh=7.2;
    doc.setFillColor(238,244,255);doc.rect(M,y,180,rh,"F");doc.setFont("helvetica","bold");doc.setTextColor(15,27,45);
    cols.forEach(([x,,t])=>doc.text(t,x+2,y+5));y+=rh;
    doc.setFont("helvetica","normal");
    list.forEach((n,i)=>{if(i%2){doc.setFillColor(247,250,255);doc.rect(M,y,180,rh,"F")}
      doc.setFontSize(10);doc.text(String(i+1),M+2,y+5);nameTxt(doc,n,M+14,y+5,10,false);
      doc.setFont("courier","bold");doc.setFontSize(12);doc.text(pwOf(c,n).split("").join(" "),M+132,y+5.1);doc.setFont("helvetica","normal");
      y+=rh});
    doc.setDrawColor(211,221,237);doc.setLineWidth(.2);doc.rect(M,34,180,y-34);
    doc.line(M+12,34,M+12,y);doc.line(M+130,34,M+130,y);
    doc.setFontSize(8.5);doc.setTextColor(74,90,112);doc.text("Document confidentiel : à conserver par le professeur.",M,287);
    /* coupons : 2 colonnes x 8 lignes par page */
    const cw=90,ch=33,gx=0,per=16;
    for(let p=0;p*per<list.length;p++){
      header("Exercice PC 3AC - Coupons à découper - "+c,`Distribuez à chaque élève son coupon · page ${p+1}/${Math.ceil(list.length/per)}`);
      list.slice(p*per,p*per+per).forEach((n,k)=>{const i=p*per+k,x=M+(k%2)*cw,yy=30+Math.floor(k/2)*ch;
        doc.setLineDashPattern([1.5,1.5],0);doc.setDrawColor(150,160,156);doc.rect(x,yy,cw,ch);doc.setLineDashPattern([],0);
        doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setTextColor(11,79,214);doc.text(`Exercice PC 3AC · ${c} · N° ${i+1}`,x+4,yy+6);
        doc.setFontSize(10.5);doc.setTextColor(15,27,45);nameTxt(doc,n,x+4,yy+13,10.5,true);
        doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(74,90,112);doc.text("Mot de passe :",x+4,yy+21);
        doc.setFont("courier","bold");doc.setFontSize(15);doc.setTextColor(15,27,45);doc.text(pwOf(c,n).split("").join(" "),x+28,yy+21.5);
        doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(74,90,112);doc.text("Garde ce mot de passe pour toi. Ne le donne à personne.",x+4,yy+28)});
    }
  });
  return doc;
}
async function accountsPdf(classes){
  await loadJsPDF();
  const doc=buildAccountsPdf(classes,profUser||"",nowStr().split(" ")[0]);
  const name="ExercicePC3AC-comptes-"+(classes.length>1?"toutes-les-classes":classes[0])+".pdf";
  if(window.Android&&Android.savePdf)return Android.savePdf(name,doc.output("datauristring").split(",")[1]);
  doc.save(name);return "Téléchargements/"+name;
}

function pAsk(){
  const {qs,i}=quiz,q=qs[i],n=qs.length;
  $app.innerHTML=`
  <div class="top"><button class="back" id="back">← Leçons</button><div class="bar"><i style="width:${i/n*100}%"></i></div><span class="count">${i+1}/${n}</span></div>

  <div id="fb" aria-live="polite"></div>
  <button class="btn" id="next" hidden>${i+1<n?"Question suivante":"Voir mon score"}</button>`;
  document.getElementById("back").onclick=practiceHome;
  const btns=[...$app.querySelectorAll(".opt")],fb=document.getElementById("fb"),next=document.getElementById("next");
  btns.forEach(b=>b.onclick=()=>{
    const good=q.opts[+b.dataset.k]===q.answer;
    if(good)quiz.score++;else quiz.miss.push(q);
    btns.forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.k]===q.answer)x.classList.add("ok")});
    if(!good)b.classList.add("ko");
    fb.innerHTML=`<div class="explain ${good?"ok":"ko"} pop"><b>${good?"Bonne réponse !":"Pas tout à fait…"}</b>${esc(q.exp)}</div>`;
    next.hidden=false;next.focus();
  });
  next.onclick=()=>{quiz.i++;quiz.i<n?pAsk():pResult()};
}
function pResult(){
  const {key,title,score,qs,miss}=quiz,n=qs.length,p=score/n,prev=prefs.best[key];
  const record=prev==null||p>prev;if(record)prefs.best[key]=p;prefs.done++;savePrefs();
  const s=starsOf(p);
  const msg=s===3?"Excellent ! Tu maîtrises cette leçon.":s===2?"Très bien ! Encore un effort pour 3 étoiles.":s===1?"C'est un début. Relis ta leçon et rejoue.":"Révise la leçon puis réessaie, tu vas progresser.";
  $app.innerHTML=`
  <section class="board result"><span class="label" style="color:var(--boardink);opacity:.8">${prefs.level} · ${esc(title)}</span>
    <div class="big">${score}/${n}</div><div class="stars">${starsHTML(s)}</div>
    <p>${msg}${record&&prev!=null?" Nouveau record !":""}</p></section>
  <div class="actions"><button class="btn" id="again">Rejouer</button><button class="btn ghost" id="menu">Choisir une autre leçon</button></div>
  ${miss.length?`<div class="label">À revoir (${miss.length})</div><div class="review">${miss.map(q=>`<div class="miss">${q.ttl?`<b>${esc(q.ttl)}</b> · `:""}${esc(q.text)}<br><span class="good">✓ ${esc(q.answer)}</span><br>${esc(q.exp)}</div>`).join("")}</div>`:""}`;
  document.getElementById("again").onclick=()=>pStart(key.split(":")[1]);
  document.getElementById("menu").onclick=practiceHome;
}

/* Reprise automatique d'un quiz noté interrompu (rechargement de la page) */
readHash();retryPending();
const pending=LS.get("ex3-run",null);
if(pending&&pending.qs&&pending.i<pending.qs.length)examAsk(pending);else home();
</script>
